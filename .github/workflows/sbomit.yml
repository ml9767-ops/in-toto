name: SBOMit workflow Build Results Comparison

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build frontend
        run: python -m pip install build

      - name: Build
        run: python -m build

      - name: Upload Baseline Results
        uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: dist/
          if-no-files-found: error

  sbomit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build frontend
        run: python -m pip install build

      - name: Build under SBOMit
        uses: Uk-jake/sbomit-pipeline-runner@main
        with:
          build-command: python -m build
          sbom-format: spdx23
          use-syft: true

      - name: Upload SBOMit Results
        uses: actions/upload-artifact@v4
        with:
          name: sbomit-results
          path: dist/
          if-no-files-found: error

  compare:
    needs: [baseline, sbomit]
    runs-on: ubuntu-22.04

    steps:
      - name: Download Baseline Results
        uses: actions/download-artifact@v4
        with:
          name: baseline-results
          path: baseline/

      - name: Download SBOMit Results
        uses: actions/download-artifact@v4
        with:
          name: sbomit-results
          path: sbomit/

      - name: Compare Build Results
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Archive SHA256 ==="
          sha256sum baseline/* sbomit/*

          mkdir -p baseline-wheel sbomit-wheel
          mkdir -p baseline-sdist sbomit-sdist

          unzip -q baseline/*.whl -d baseline-wheel
          unzip -q sbomit/*.whl -d sbomit-wheel

          tar -xzf baseline/*.tar.gz -C baseline-sdist
          tar -xzf sbomit/*.tar.gz -C sbomit-sdist

          status=0

          echo "=== Comparing Wheel Contents ==="
          if diff -qr baseline-wheel sbomit-wheel; then
            echo "Wheel contents: IDENTICAL"
          else
            echo "Wheel contents: DIFFERENT"
            status=1
          fi

          echo "=== Comparing Source Distribution Contents ==="
          if diff -qr baseline-sdist sbomit-sdist; then
            echo "Source distribution contents: IDENTICAL"
          else
            echo "Source distribution contents: DIFFERENT"
            status=1
          fi

          exit "$status"
